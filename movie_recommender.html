<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Movie Recommender</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc; /* Slate 50 */
            background-image: radial-gradient(circle at top, #1e293b 0%, #0f172a 50%);
            min-height: 100vh;
        }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .movie-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .movie-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

       
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin 1.5s linear infinite;
        }
    </style>
</head>
<body class="antialiased pb-20">

   
    <header class="pt-20 pb-12 px-4 text-center">
        <h1 class="text-5xl md:text-6xl font-extrabold tracking-tight mb-4">
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-500 to-purple-600">
                Movie Recommender
            </span>
        </h1>
        <p class="text-slate-400 text-lg md:text-xl max-w-2xl mx-auto">
            Discover your next favorite film. Enter a movie you love, and our intelligent AI will curate the perfect watchlist.
        </p>
    </header>

   
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        
       
        <div class="glass-panel rounded-2xl p-4 md:p-6 mb-12 shadow-2xl max-w-4xl mx-auto">
            <form id="search-form" class="flex flex-col md:flex-row gap-4 items-center">
                
              
                <div class="relative w-full flex-grow">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>
                    <input type="text" id="movie-input" required
                        class="block w-full pl-10 pr-3 py-3 border border-slate-600 rounded-xl leading-5 bg-slate-800 text-slate-300 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors"
                        placeholder="Enter movie name... (e.g. The Matrix)">
                </div>

                
                <div class="w-full md:w-32 flex-shrink-0 relative">
                    <label for="num-input" class="absolute -top-2 left-3 inline-block bg-slate-800 px-1 text-xs font-medium text-slate-400 rounded">Count</label>
                    <input type="number" id="num-input" min="1" max="50" value="10"
                        class="block w-full px-3 py-3 border border-slate-600 rounded-xl leading-5 bg-slate-800 text-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors">
                </div>

               
                <button type="submit"
                    class="w-full md:w-auto flex-shrink-0 inline-flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-xl shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 focus:ring-indigo-500 transition-colors">
                    Get Recommendations
                </button>
            </form>
        </div>

        
        <div id="status-container" class="w-full flex justify-center items-center py-10 hidden">
            
            <div id="loader" class="hidden flex-col items-center">
                <svg class="animate-spin-slow h-12 w-12 text-indigo-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="text-slate-400 text-sm animate-pulse">Running recommender.py engine...</p>
            </div>

            
            <div id="error-message" class="hidden text-center bg-red-900/20 border border-red-500/30 rounded-xl p-6 max-w-md w-full">
                <svg class="h-10 w-10 text-red-400 mx-auto mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <h3 class="text-lg font-medium text-red-300" id="error-title">Movie not found</h3>
                <p class="mt-2 text-sm text-red-200/70" id="error-desc">We couldn't find a match for your query in the dataset. Try another title.</p>
            </div>
        </div>

        
        <div id="results-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            
        </div>

    </main>

    <script>
        
        const form = document.getElementById('search-form');
        const movieInput = document.getElementById('movie-input');
        const numInput = document.getElementById('num-input');
        const statusContainer = document.getElementById('status-container');
        const loader = document.getElementById('loader');
        const errorMessage = document.getElementById('error-message');
        const resultsGrid = document.getElementById('results-grid');

        
        async function fetchRecommendations(movieName) {
    try {
        
        const response = await fetch(`http://localhost:5000/api/recommend?movie=${encodeURIComponent(movieName)}`);
        
        if (!response.ok) {
            throw new Error('Network response was not ok');
        }
        
       
        const data = await response.json();
        return data; 
        
    } catch (error) {
        console.error("Error fetching data:", error);
        throw error;
    }
}

       
        function generateGenreTags(genreString) {
            if (!genreString || genreString === "(no genres listed)") return '<span class="px-2 py-1 bg-slate-700 text-slate-300 text-xs rounded-md">Unknown</span>';
            
            const genres = genreString.split('|');
            return genres.map(g => 
                `<span class="px-2 py-1 bg-slate-700/50 border border-slate-600 text-indigo-300 text-xs rounded-md shadow-sm">${g}</span>`
            ).join('');
        }

        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const query = movieInput.value.trim();
            const count = parseInt(numInput.value, 10) || 10;

            if (!query) return;

            
            resultsGrid.innerHTML = '';
            statusContainer.classList.remove('hidden');
            loader.classList.remove('hidden');
            errorMessage.classList.add('hidden');
            loader.classList.add('flex'); 

            try {
               
                const recommendations = await fetchRecommendations(query, count);

               
                statusContainer.classList.add('hidden');
                loader.classList.add('hidden');
                loader.classList.remove('flex');

                if (recommendations.length === 0) {
                    throw new Error("Movie not found"); 
                }

               
                recommendations.forEach((movie, index) => {
                    const card = document.createElement('div');
                    card.className = "movie-card bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 flex flex-col h-full";
                    
                    card.innerHTML = `
                        <div class="p-5 flex-grow flex flex-col">
                            <!-- Header -->
                            <div class="flex justify-between items-start mb-3">
                                <h3 class="text-lg font-bold text-white leading-tight pr-2 flex-grow">${movie.title}</h3>
                                <div class="flex items-center bg-slate-900 px-2 py-1 rounded-lg border border-slate-700 shadow-inner shrink-0">
                                    <svg class="w-4 h-4 text-yellow-500 mr-1" fill="currentColor" viewBox="0 0 20 20">
                                        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                                    </svg>
                                    <span class="text-sm font-semibold text-slate-200">${movie.rating}</span>
                                </div>
                            </div>

                            <!-- Genres -->
                            <div class="flex flex-wrap gap-2 mb-6 flex-grow">
                                ${generateGenreTags(movie.genres)}
                            </div>

                            <!-- Footer / Score -->
                            <div class="mt-auto pt-4 border-t border-slate-700 flex items-center justify-between">
                                <span class="text-sm text-slate-400">Match Score</span>
                                <div class="flex items-center">
                                    <!-- Progress ring placeholder -->
                                    <div class="text-sm font-mono font-bold text-emerald-400 bg-emerald-900/30 px-2 py-1 rounded border border-emerald-500/30">
                                        ${(movie.score * 100).toFixed(1)}%
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    
                    
                    card.style.animation = `fadeIn 0.5s ease forwards ${index * 0.05}s`;
                    card.style.opacity = 0; // Handled by inline CSS injection for fade in
                    
                    resultsGrid.appendChild(card);
                });

            } catch (error) {
                
                loader.classList.add('hidden');
                loader.classList.remove('flex');
                errorMessage.classList.remove('hidden');
                
                document.getElementById('error-title').textContent = error.message;
                if (error.message === "Movie not found") {
                    document.getElementById('error-desc').textContent = "We couldn't find a match for your query in the dataset. Try another title.";
                } else {
                    document.getElementById('error-desc').textContent = "There was an issue connecting to the recommender engine. Please try again.";
                }
            }
        });

        
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
        `;
        document.head.appendChild(style);

    </script>
</body>
</html>
